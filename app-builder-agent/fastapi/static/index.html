<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Builder Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e0e4e8;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a2e;
  }
  header span {
    font-size: 12px;
    background: #29B5E8;
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #29B5E8;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: #fff;
    color: #1a1a2e;
    border: 1px solid #e0e4e8;
    border-bottom-left-radius: 4px;
  }
  .msg.agent code {
    background: #f0f2f5;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg.agent pre {
    background: #1e1e2e;
    color: #cdd6f4;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.4;
  }
  .msg.agent pre code {
    background: none;
    padding: 0;
    color: inherit;
  }
  .thinking {
    align-self: flex-start;
    color: #888;
    font-size: 14px;
    padding: 8px 16px;
  }
  .thinking::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }
  #input-bar {
    background: #fff;
    border-top: 1px solid #e0e4e8;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
  }
  #input-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #input-bar input:focus { border-color: #29B5E8; }
  #input-bar button {
    background: #29B5E8;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  #input-bar button:hover { background: #1da1d1; }
  #input-bar button:disabled { background: #a0d8ef; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>App Builder Agent</h1>
  <span>Coding Agent</span>
</header>
<div id="messages"></div>
<div id="input-bar">
  <input id="input" type="text" placeholder="Describe the app you want to build..." autofocus>
  <button id="send" onclick="sendMessage()">Send</button>
</div>
<script>
let threadId = null;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !sendBtn.disabled) sendMessage();
});

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderMarkdown(text) {
  // Escape first: agent output is untrusted and must not inject HTML.
  text = escapeHtml(text);
  // Convert fenced code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
  // Convert inline code
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  return text;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  if (role === "agent") {
    div.innerHTML = renderMarkdown(text);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "thinking";
  div.textContent = "Thinking";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  sendBtn.disabled = true;
  addMessage("user", text);
  const thinkingEl = addThinking();

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const event = JSON.parse(line);
          if (event.type === "thread_id") {
            threadId = event.thread_id;
          } else if (event.type === "text") {
            thinkingEl.remove();
            addMessage("agent", event.text);
          }
        } catch { /* skip malformed line */ }
      }
    }
  } catch (err) {
    thinkingEl.remove();
    addMessage("agent", "Error: " + err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
