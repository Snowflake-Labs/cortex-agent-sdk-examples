<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automated Data Profiler</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e0e4e8;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #1a1a2e; }
  header span {
    font-size: 12px;
    background: #29B5E8;
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
  }

  #profile-bar {
    background: #fff;
    border-bottom: 1px solid #e0e4e8;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  #profile-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    font-family: "SF Mono", "Fira Code", monospace;
    outline: none;
  }
  #profile-bar input:focus { border-color: #29B5E8; }
  #profile-bar button {
    background: #29B5E8;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  #profile-bar button:hover { background: #1da1d1; }
  #profile-bar button:disabled { background: #a0d8ef; cursor: not-allowed; }

  #results {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .report {
    background: #fff;
    border: 1px solid #e0e4e8;
    border-radius: 12px;
    padding: 24px;
    line-height: 1.6;
    font-size: 14px;
    color: #1a1a2e;
  }
  .report h1 { font-size: 20px; margin: 20px 0 10px; color: #1a1a2e; }
  .report h2 { font-size: 17px; margin: 18px 0 8px; color: #29B5E8; }
  .report h3 { font-size: 15px; margin: 14px 0 6px; color: #1a1a2e; }
  .report h1:first-child, .report h2:first-child { margin-top: 0; }
  .report p { margin: 6px 0; }
  .report ul, .report ol { margin: 6px 0 6px 20px; }
  .report strong { color: #1a1a2e; }
  .report code {
    background: #f0f2f5;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", monospace;
  }
  .report pre {
    background: #1e1e2e;
    color: #cdd6f4;
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 10px 0;
    font-size: 13px;
    line-height: 1.4;
  }
  .report pre code {
    background: none;
    padding: 0;
    color: inherit;
  }
  .report table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
  }
  .report th {
    background: #f0f5fa;
    border: 1px solid #d0d5dd;
    padding: 8px 12px;
    text-align: left;
    font-weight: 600;
    color: #1a1a2e;
  }
  .report td {
    border: 1px solid #e0e4e8;
    padding: 8px 12px;
  }
  .report tr:nth-child(even) td { background: #fafbfc; }
  .report blockquote {
    border-left: 3px solid #29B5E8;
    padding: 8px 16px;
    margin: 10px 0;
    background: #f0f8ff;
    color: #555;
  }
  .report hr { border: none; border-top: 1px solid #e0e4e8; margin: 16px 0; }

  .msg-user {
    align-self: flex-end;
    max-width: 60%;
    background: #29B5E8;
    color: #fff;
    padding: 10px 16px;
    border-radius: 12px;
    border-bottom-right-radius: 4px;
    font-size: 14px;
  }

  .thinking {
    color: #888;
    font-size: 14px;
    padding: 8px 0;
  }
  .thinking::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  #followup-bar {
    background: #fff;
    border-top: 1px solid #e0e4e8;
    padding: 16px 24px;
    display: none;
    gap: 12px;
  }
  #followup-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #followup-bar input:focus { border-color: #29B5E8; }
  #followup-bar button {
    background: #29B5E8;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  #followup-bar button:hover { background: #1da1d1; }
  #followup-bar button:disabled { background: #a0d8ef; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Automated Data Profiler</h1>
  <span>Coding Agent</span>
</header>

<div id="profile-bar">
  <input id="table-input" type="text" placeholder="DB.SCHEMA.TABLE" autofocus>
  <button id="profile-btn" onclick="profileTable()">Profile Table</button>
</div>

<div id="results"></div>

<div id="followup-bar">
  <input id="followup-input" type="text" placeholder="Ask a follow-up question about this table...">
  <button id="followup-btn" onclick="sendFollowup()">Send</button>
</div>

<script>
let threadId = null;
let currentTable = null;

const resultsEl = document.getElementById("results");
const tableInput = document.getElementById("table-input");
const profileBtn = document.getElementById("profile-btn");
const followupBar = document.getElementById("followup-bar");
const followupInput = document.getElementById("followup-input");
const followupBtn = document.getElementById("followup-btn");

tableInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !profileBtn.disabled) profileTable();
});
followupInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !followupBtn.disabled) sendFollowup();
});

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function renderMarkdown(text) {
  // Escape first: the report echoes values from the profiled table.
  text = escapeHtml(text);
  // Fenced code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
  // Tables
  text = text.replace(/((?:^\|.+\|$\n?)+)/gm, (block) => {
    const rows = block.trim().split("\n").filter(r => r.trim());
    if (rows.length < 2) return block;
    const parseRow = (r) => r.split("|").slice(1, -1).map(c => c.trim());
    const headers = parseRow(rows[0]);
    // Skip separator row
    const startIdx = /^\|[\s\-:|]+\|$/.test(rows[1]) ? 2 : 1;
    let html = "<table><thead><tr>";
    headers.forEach(h => { html += `<th>${h}</th>`; });
    html += "</tr></thead><tbody>";
    for (let i = startIdx; i < rows.length; i++) {
      const cells = parseRow(rows[i]);
      html += "<tr>";
      cells.forEach(c => { html += `<td>${c}</td>`; });
      html += "</tr>";
    }
    html += "</tbody></table>";
    return html;
  });
  // Headings
  text = text.replace(/^#### (.+)$/gm, "<h4>$1</h4>");
  text = text.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  text = text.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  text = text.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  // Bold & italic
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");
  // Inline code (after code blocks)
  text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  // Blockquotes
  text = text.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
  // Horizontal rules
  text = text.replace(/^---$/gm, "<hr>");
  // Unordered lists
  text = text.replace(/^[\-\*] (.+)$/gm, "<li>$1</li>");
  text = text.replace(/((?:<li>.*<\/li>\n?)+)/g, "<ul>$1</ul>");
  // Paragraphs — wrap remaining loose lines
  text = text.replace(/^(?!<[a-z])((?!<).+)$/gm, "<p>$1</p>");
  return text;
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "thinking";
  div.textContent = "Profiling";
  resultsEl.appendChild(div);
  resultsEl.scrollTop = resultsEl.scrollHeight;
  return div;
}

function setLoading(btn, loading) {
  btn.disabled = loading;
  profileBtn.disabled = loading;
  followupBtn.disabled = loading;
}

async function doRequest(body, thinkingText) {
  const thinkingEl = addThinking();
  thinkingEl.textContent = thinkingText || "Profiling";

  try {
    const resp = await fetch("/profile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const event = JSON.parse(line);
          if (event.type === "thread_id") {
            threadId = event.thread_id;
          } else if (event.type === "text") {
            thinkingEl.remove();
            const div = document.createElement("div");
            div.className = "report";
            div.innerHTML = renderMarkdown(event.text);
            resultsEl.appendChild(div);
            resultsEl.scrollTop = resultsEl.scrollHeight;
          }
        } catch { /* skip malformed line */ }
      }
    }
  } catch (err) {
    thinkingEl.remove();
    const div = document.createElement("div");
    div.className = "report";
    div.innerHTML = `<p><strong>Error:</strong> ${err.message}</p>`;
    resultsEl.appendChild(div);
  }
}

async function profileTable() {
  const table = tableInput.value.trim();
  if (!table) return;

  currentTable = table;
  threadId = null;
  resultsEl.innerHTML = "";
  setLoading(profileBtn, true);

  await doRequest({ table, thread_id: null }, "Profiling");

  setLoading(profileBtn, false);
  followupBar.style.display = "flex";
  followupInput.focus();
}

async function sendFollowup() {
  const message = followupInput.value.trim();
  if (!message || !currentTable) return;

  followupInput.value = "";
  setLoading(followupBtn, true);

  const userDiv = document.createElement("div");
  userDiv.className = "msg-user";
  userDiv.textContent = message;
  resultsEl.appendChild(userDiv);
  resultsEl.scrollTop = resultsEl.scrollHeight;

  await doRequest({ table: currentTable, message, thread_id: threadId }, "Thinking");

  setLoading(followupBtn, false);
  followupInput.focus();
}
</script>
</body>
</html>
