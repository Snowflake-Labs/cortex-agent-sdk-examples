<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural Language Analytics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8fa;
    color: #1e2a3a;
    line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 24px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    font-size: 0.95rem;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-row input:focus { border-color: #29B5E8; box-shadow: 0 0 0 3px rgba(41,181,232,0.15); }
  .input-row button {
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 500;
    background: #29B5E8;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .input-row button:hover { background: #1a9fd4; }
  .input-row button:disabled { background: #a0d8ef; cursor: not-allowed; }
  .status {
    font-size: 0.85rem;
    color: #667085;
    min-height: 20px;
    margin-bottom: 16px;
  }
  .results { display: none; }
  .results.visible { display: block; }
  .section { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .section h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #667085; margin-bottom: 10px; }
  .answer { white-space: pre-wrap; font-size: 0.95rem; }
  pre {
    background: #1e2a3a;
    color: #e2e8f0;
    padding: 16px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    text-align: left;
    padding: 8px 12px;
    background: #f7f8fa;
    border-bottom: 2px solid #e4e7ec;
    font-weight: 600;
    color: #344054;
    white-space: nowrap;
  }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid #f0f1f3;
  }
  tbody tr:hover { background: #f9fafb; }
  .table-wrap { overflow-x: auto; }
  .error { color: #d92d20; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Natural Language Analytics</h1>
  <div class="input-row">
    <input type="text" id="question" placeholder="Ask a question about your data..." />
    <button id="ask-btn" onclick="askQuestion()">Ask</button>
  </div>
  <div class="status" id="status"></div>
  <div class="results" id="results">
    <div class="section" id="answer-section" style="display:none">
      <h3>Answer</h3>
      <div class="answer" id="answer"></div>
    </div>
    <div class="section" id="sql-section" style="display:none">
      <h3>SQL</h3>
      <pre><code id="sql-code"></code></pre>
    </div>
    <div class="section" id="table-section" style="display:none">
      <h3>Data</h3>
      <div class="table-wrap" id="data-table"></div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);

$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter") askQuestion();
});

async function askQuestion() {
  const question = $("question").value.trim();
  if (!question) return;

  const btn = $("ask-btn");
  btn.disabled = true;
  $("status").textContent = "";
  $("answer").textContent = "";
  $("sql-code").textContent = "";
  $("data-table").innerHTML = "";
  $("answer-section").style.display = "none";
  $("sql-section").style.display = "none";
  $("table-section").style.display = "none";
  $("results").classList.add("visible");

  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try { handleEvent(JSON.parse(line)); } catch {}
      }
    }
    if (buffer.trim()) {
      try { handleEvent(JSON.parse(buffer)); } catch {}
    }
  } catch (err) {
    $("status").innerHTML = '<span class="error">Request failed: ' + err.message + "</span>";
  } finally {
    btn.disabled = false;
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "status":
      $("status").textContent = ev.message;
      break;
    case "text":
      $("answer-section").style.display = "block";
      $("answer").textContent += ev.text;
      break;
    case "sql":
      $("sql-section").style.display = "block";
      $("sql-code").textContent = ev.sql;
      break;
    case "data":
      renderTable(ev.data);
      break;
    case "error":
      $("status").innerHTML = '<span class="error">' + escapeHtml(ev.message) + "</span>";
      break;
    case "done":
      if (!$("status").querySelector(".error")) $("status").textContent = "";
      break;
  }
}

function renderTable(data) {
  if (!data) return;
  let columns, rows;

  if (Array.isArray(data) && data.length > 0) {
    if (Array.isArray(data[0])) {
      columns = data[0];
      rows = data.slice(1);
    } else if (typeof data[0] === "object") {
      columns = Object.keys(data[0]);
      rows = data.map((r) => columns.map((c) => r[c]));
    } else {
      return;
    }
  } else if (data.columns && data.rows) {
    columns = data.columns;
    rows = data.rows;
  } else {
    return;
  }

  const thead = columns.map((c) => "<th>" + escapeHtml(String(c)) + "</th>").join("");
  const tbody = rows
    .map((r) => "<tr>" + r.map((v) => "<td>" + escapeHtml(v == null ? "" : String(v)) + "</td>").join("") + "</tr>")
    .join("");
  $("data-table").innerHTML = "<table><thead><tr>" + thead + "</tr></thead><tbody>" + tbody + "</tbody></table>";
  $("table-section").style.display = "block";
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
